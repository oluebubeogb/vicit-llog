version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: vicit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vicit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vicit_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vicit_llog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vicit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vicit-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vicit:vicit_secret_change_me@db:5432/vicit_llog?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PHOTO_STORAGE_PATH: /data/photos
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      INVITE_LINK_TTL_MINUTES: ${INVITE_LINK_TTL_MINUTES:-60}
      PORT: 4000
      # Phase 2
      PHOTO_RETENTION_DAYS: ${PHOTO_RETENTION_DAYS:-90}
      ENABLE_PUSH: ${ENABLE_PUSH:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
    volumes:
      - ./data/photos:/data/photos
      - ./data/reports:/data/reports
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vicit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Vicit Llog}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
