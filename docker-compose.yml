version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vicit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vicit_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vicit_llog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Do NOT publish 5432 on the host — Coolify / other apps often already use it.
    # Backend reaches DB via internal Docker network: host "db", port 5432.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vicit} -d ${POSTGRES_DB:-vicit_llog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vicit:vicit_secret_change_me@db:5432/vicit_llog?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PHOTO_STORAGE_PATH: /data/photos
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      INVITE_LINK_TTL_MINUTES: ${INVITE_LINK_TTL_MINUTES:-60}
      PORT: 4000
      PHOTO_RETENTION_DAYS: ${PHOTO_RETENTION_DAYS:-90}
      ENABLE_PUSH: ${ENABLE_PUSH:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
    volumes:
      - photos_data:/data/photos
      - reports_data:/data/reports
    expose:
      - "4000"
    # Optional host bind only if you need direct access outside Coolify proxy:
    # ports:
    #   - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Vicit Llog}
    expose:
      - "3000"
    # Optional host bind only if you need direct access outside Coolify proxy:
    # ports:
    #   - "3000:3000"

volumes:
  postgres_data:
  photos_data:
  reports_data:
